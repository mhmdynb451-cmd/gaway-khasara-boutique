name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: CI sanity checks for Android asset bundle
        run: |
          echo "=== Starting CI Sanity Checks ==="
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html does not exist!"
            exit 1
          fi

          if grep -q -E 'href="/|src="/' dist/index.html; then
            echo "ERROR: Found absolute root asset paths in dist/index.html!"
            grep -E 'href="/|src="/' dist/index.html
            exit 1
          fi

          if [ ! -d "dist/assets" ] || [ -z "$(ls -A dist/assets)" ]; then
            echo "ERROR: dist/assets directory missing or empty!"
            exit 1
          fi

          if [ ! -f "dist/manifest.webmanifest" ]; then
            echo "ERROR: dist/manifest.webmanifest missing!"
            exit 1
          fi

          echo "=== CI Sanity Checks Passed Successfully ==="

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
