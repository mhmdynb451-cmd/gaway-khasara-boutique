      - name: Setup Android SDK (non-interactive, bounded)
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          SDK_ROOT="${RUNNER_TOOL_CACHE}/android-sdk"
          mkdir -p "${SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl

          TMP_ZIP="/tmp/cmdline-tools.zip"
          CMDLINE_ZIP_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -fSL "$CMDLINE_ZIP_URL" -o "${TMP_ZIP}"

          mkdir -p "${SDK_ROOT}/cmdline-tools"
          unzip -q "${TMP_ZIP}" -d "${SDK_ROOT}/cmdline-tools/"
          rm -f "${TMP_ZIP}"

          if [ -d "${SDK_ROOT}/cmdline-tools/cmdline-tools" ]; then
            mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools"/* "${SDK_ROOT}/cmdline-tools/latest/" || true
          elif [ -d "${SDK_ROOT}/cmdline-tools/tools" ]; then
            mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
            mv "${SDK_ROOT}/cmdline-tools/tools"/* "${SDK_ROOT}/cmdline-tools/latest/" || true
          else
            mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
            mv "${SDK_ROOT}/cmdline-tools/"* "${SDK_ROOT}/cmdline-tools/latest/" 2>/dev/null || true
          fi

          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          echo "PATH=$PATH" >> $GITHUB_ENV

          # إنشاء ملفات التراخيص مسبقاً لمنع أي توقف تفاعلي
          mkdir -p "${SDK_ROOT}/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_ROOT}/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          echo "d56f5187479451ea9cc7379b3d4b2a8a0b6a3b8b" > "${SDK_ROOT}/licenses/android-googletv-license" || true

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          install_packages() {
            local root="$1"
            local packages=( "platform-tools" "platforms;android-33" "build-tools;33.0.2" )
            local attempts=3
            local attempt=1
            while [ $attempt -le $attempts ]; do
              echo "sdkmanager attempt $attempt/${attempts} (timeout 3m)"
              if timeout 3m "$SDKMANAGER" --sdk_root="${root}" "${packages[@]}" > /tmp/sdkmanager-install.log 2>&1; then
                echo "sdkmanager install succeeded"
                return 0
              else
                echo "sdkmanager install failed on attempt $attempt; log output:"
                tail -n 200 /tmp/sdkmanager-install.log || true
                attempt=$((attempt + 1))
                sleep 5
              fi
            done
            return 1
          }

          if ! install_packages "${SDK_ROOT}"; then
            echo "Aborting due to sdkmanager failures to avoid indefinite hang."
            exit 1
          fi

      - name: Build Debug APK (bounded Gradle)
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.jvmargs=-Xms512m
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          timeout 30m ./gradlew assembleDebug --no-daemon --console=plain --stacktrace || {
            echo "Gradle build failed or timed out."
            exit 1
          }
          
