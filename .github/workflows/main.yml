name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web assets (production)
        run: |
          npm run build

      - name: Copy web assets into Android assets and sync Capacitor
        run: |
          # ensure target dir exists
          mkdir -p android/app/src/main/assets/public
          # copy dist -> Android public (rsync keeps deletions in sync)
          rsync -a --delete dist/ android/app/src/main/assets/public/
          # update native plugins/config (will generate capacitor config under android assets if needed)
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bait-elhdaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
