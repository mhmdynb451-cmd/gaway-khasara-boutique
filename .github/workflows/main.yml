name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (resilient)
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "Lockfile detected; running 'npm ci' for deterministic install"
            npm ci --legacy-peer-deps
          else
            echo "No lockfile found; running 'npm install' (non-deterministic) as a fallback"
            npm install --legacy-peer-deps
          fi

      - name: Build Web App
        run: npm run build

      - name: CI sanity checks for Android asset bundle
        run: |
          echo "=== Starting CI Sanity Checks ==="
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html does not exist!"
            exit 1
          fi

          if grep -q -E 'href="/|src="/' dist/index.html; then
            echo "ERROR: Found absolute root asset paths in dist/index.html!"
            grep -E 'href="/|src="/' dist/index.html
            exit 1
          fi

          if [ ! -d "dist/assets" ] || [ -z "$(ls -A dist/assets)" ]; then
            echo "ERROR: dist/assets directory missing or empty!"
            exit 1
          fi

          if [ ! -f "dist/manifest.webmanifest" ]; then
            echo "ERROR: dist/manifest.webmanifest missing!"
            exit 1
          fi

          echo "=== CI Sanity Checks Passed Successfully ==="

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK (non-interactive, robust license accept)
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${RUNNER_TOOL_CACHE}/android-sdk"
          mkdir -p "${SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip expect

          TMP_ZIP="/tmp/cmdline-tools.zip"
          curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o "${TMP_ZIP}"
          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
          unzip -q "${TMP_ZIP}" -d "${SDK_ROOT}/cmdline-tools/latest"
          rm -f "${TMP_ZIP}"

          export PATH="${SDK_ROOT}/cmdline-tools/latest/cmdline-tools/bin:${SDK_ROOT}/platform-tools:${PATH}"

          yes | sdkmanager --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

          cat > /tmp/accept-android-licenses.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout -1
          set sdkroot [lindex $argv 0]
          set cmd [list [file join $sdkroot "cmdline-tools" "latest" "cmdline-tools" "bin" "sdkmanager"] "--sdk_root=${sdkroot}" "--licenses"]
          spawn {*}$cmd
          expect {
            eof { exit 0 }
            -re ".*" {
              send "y\r"
              exp_continue
            }
          }
          EXPECT
          chmod +x /tmp/accept-android-licenses.exp

          /tmp/accept-android-licenses.exp "${SDK_ROOT}"
          sdkmanager --sdk_root="${SDK_ROOT}" --list_installed
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
