name: CI - Build web + Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    env:
      ADB_INSTALL_TIMEOUT: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (production)
        run: npm run build

      - name: Inject build stamp
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "$SHA" > dist/BUILD_COMMIT
          sed -i "1i<!-- BUILD: $SHA -->" dist/index.html || true
          echo "Inserted BUILD: $SHA into dist/index.html"

      - name: Ensure Android assets cleared
        run: |
          if [ -d "android/app/src/main/assets/public" ]; then
            rm -rf android/app/src/main/assets/public/* || true
            echo "Cleared android assets public dir"
          else
            mkdir -p android/app/src/main/assets/public
            echo "Created android assets public dir"
          fi

      - name: Copy web assets to Android (Capacitor)
        run: |
          npx cap copy android
          npx cap sync android

      - name: Verify copied files
        run: |
          ls -la android/app/src/main/assets/public | sed -n '1,200p' || true
          grep -n "BUILD:" android/app/src/main/assets/public/index.html || true

      - name: Set up Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK (Gradle)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
