name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prepare web dir and sync Capacitor
        run: |
          mkdir -p dist
          echo '<!doctype html><html><head><meta http-equiv="refresh" content="0;url=https://id-preview--9e55d2bd-bda5-5de7-969f-b6e7ef1dcfe4.lovable.app"></head><body></body></html>' > dist/index.html
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bait-elhdaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
