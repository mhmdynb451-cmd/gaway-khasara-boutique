name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a637b3749d10e3b79793cd54617873e98" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd9760cb00964c8d8b93d0f0310237ee3d997f748" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\n6010077a9a16f4ef884a01f16c12741a953d437b" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9ac3510e14a242f3607fc8a529323eb7dd47294" > $ANDROID_HOME/licenses/mips-android-sysimage-license

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prepare web dir and sync Capacitor
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://id-preview--9e5562bd-b6a3-43da-8e7d-cb091a18ee43.lovable.app/"></head><body></body></html>' > dist/index.html
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bait-elhdaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
