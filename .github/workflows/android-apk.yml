name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept All Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a637b3749d10e3b79793cd54617873e98\n89330d222604205701narrow2308670891a0c8b65786" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\nd976narrow2308670891a0c8b65786\n3b357ab9a5b106206709459aa7073200b40939f2" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n6010077narrow2308670891a0c8b65786\n33b622f7narrow2308670891a0c8b65786" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "\ne96narrow2308670891a0c8b65786\ne284narrow2308670891a0c8b65786" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prepare web dir and sync Capacitor
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://id-preview--9e5562bd-b6a3-43da-8e7d-cb091a18ee43.lovable.app/"></head><body></body></html>' > dist/index.html
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bait-elhdaya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
