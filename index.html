<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بيت الهدايا</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errMessage = "Runtime Error:\n" + msg + "\n\nLine: " + line + "\nURL: " + url;
        if (error && error.stack) {
          errMessage += "\n\nStack:\n" + error.stack;
        }
        alert(errMessage);
      };
      window.onunhandledrejection = function(e) {
        alert("Unhandled Rejection:\n" + (e.reason ? (e.reason.stack || e.reason) : e));
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/router.tsx"></script>
  </body>
</html>
